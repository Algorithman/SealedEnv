name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        # global.json pins the build SDK; older TFM targeting packs auto-restore.
        with:
          dotnet-version: 11.0.x
      - name: Verify formatting
        run: dotnet format --verify-no-changes

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        # global.json selects 11.0.x as the build SDK; 8-10 are installed for the
        # test runtimes (SealedEnv.Tests runs its matrix on every maintained TFM)
        # and their targeting packs.
        with:
          dotnet-version: |
            11.0.x
            10.0.x
            9.0.x
            8.0.x
      - name: Build
        run: dotnet build
      - name: Test
        run: dotnet test --no-build
      - name: Cross-check benchmark scenarios
        # Phase 6 (SealedEnv-PLAN.md §3): all four benchmark approaches must bind
        # identical values — cheap self-check, unlike a real BenchmarkDotNet run.
        run: dotnet run --project benchmarks/SealedEnv.Benchmarks --no-build -- --verify

  aot-publish:
    # Phase 5 gate (SealedEnv-PLAN.md §3): the sample must NativeAOT-publish AND run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: SampleConsoleApp
          - os: windows-latest
            rid: win-x64
            exe: SampleConsoleApp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        # The native binary is self-contained, so only the build SDK (11.0.x per
        # global.json) is needed; the net10.0 targeting pack auto-restores.
        with:
          dotnet-version: 11.0.x
      - name: Install native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish NativeAOT
        # PublishAot is declared in the sample csproj: passing it as a global
        # -p:PublishAot=true would flow into the referenced netstandard2.0
        # generator project and fail with NETSDK1207.
        run: dotnet publish samples/SampleConsoleApp -c Release -r ${{ matrix.rid }} --self-contained
      - name: Run the native binary
        shell: bash
        run: |
          set -e
          exe="samples/SampleConsoleApp/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.exe }}"
          SAMPLE_PORT=9091 SAMPLE_DBCONNECTION="Host=db" SAMPLE_HOSTS="a,b" "$exe" | grep "Loaded SampleConfig"
          if SAMPLE_DBCONNECTION="" "$exe"; then
            echo "::error::AOT binary succeeded despite an unset required variable"
            exit 1
          fi

  release:
    # Phase 7 (SealedEnv-PLAN.md §3): tag vX.Y.Z -> pack -> NuGet push -> GitHub release.
    # Publishing uses NuGet trusted publishing (OIDC): no stored API key. This
    # requires a trusted publisher registered on nuget.org FIRST (account -> API
    # Keys -> Trusted Publishing: owner, repo Algorithman/SealedEnv, workflow
    # ci.yml, package ID glob SealedEnv*) or the login step fails.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      id-token: write   # OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
      - name: Verify tag matches VersionPrefix
        run: |
          version=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix (expected v$version)"
            exit 1
          fi
      - name: Pack
        # ContinuousIntegrationBuild normalizes paths so SourceLink URLs and the
        # embedded sources are reproducible on any machine. Both packages carry
        # the same VersionPrefix; the DotEnv nuspec depends on the core package.
        run: |
          dotnet pack src/SealedEnv -c Release -p:ContinuousIntegrationBuild=true -o artifacts
          dotnet pack src/SealedEnv.DotEnv -c Release -p:ContinuousIntegrationBuild=true -o artifacts
      - name: NuGet login (trusted publishing)
        # Exchanges this job's OIDC token for a ~1-hour push token against the
        # trust registered on nuget.org — no long-lived secret involved.
        uses: NuGet/login@v1
        id: login
        with:
          user: Algorithman
      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes artifacts/SealedEnv.*.nupkg artifacts/SealedEnv.*.snupkg
